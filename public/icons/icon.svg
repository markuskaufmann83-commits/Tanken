<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="pumpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.25" />

  <!-- Gas Pump Body -->
  <g filter="url(#shadow)">
    <!-- Base / Stand -->
    <path d="M120 400 L300 400 L285 380 L135 380 Z" fill="#334155" />

    <!-- Pump Pillar -->
    <rect x="135" y="140" width="150" height="240" rx="16" fill="url(#pumpGrad)" />

    <!-- Screen display on pump -->
    <rect x="155" y="170" width="110" height="75" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="3" />
    <!-- Price readout lines in screen -->
    <rect x="170" y="188" width="55" height="12" rx="4" fill="#a7f3d0" />
    <rect x="235" y="184" width="18" height="10" rx="2" fill="url(#goldGrad)" />
    <rect x="170" y="212" width="80" height="10" rx="3" fill="#6ee7b7" opacity="0.8" />

    <!-- Fuel nozzle holster & hose -->
    <!-- Hose connector on top right -->
    <path d="M260 210 C330 210, 360 260, 360 320 C360 350, 345 370, 330 370 C315 370, 310 350, 310 320 L310 240" 
          fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round" />

    <!-- Nozzle Handle -->
    <path d="M300 240 L310 200 L335 190 L345 220 L320 230" fill="url(#goldGrad)" />
    <path d="M335 190 L355 140 L340 135 L320 180" fill="#94a3b8" stroke="#475569" stroke-width="3" />
    <circle cx="320" cy="210" r="4" fill="#1e293b" />

    <!-- Gasoline Drop / Leaf Symbol on base -->
    <path d="M210 290 C210 290, 185 320, 185 335 C185 348, 196 358, 210 358 C224 358, 235 348, 235 335 C235 320, 210 290, 210 290 Z" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
